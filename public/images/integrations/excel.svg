<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <filter id="xlShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="#ffffff" filter="url(#xlShadow)"/>
  <g transform="translate(8, 8)">
    <!-- Back Sheet Grid (Green Folder) -->
    <rect x="8" y="4" width="22" height="24" rx="3" fill="#107C41"/>
    <!-- Spreadsheet lines on the right -->
    <path d="M19 9H26M19 14H26M19 19H26M19 24H26" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Front 'X' Tile -->
    <rect x="2" y="8" width="16" height="16" rx="3" fill="#0C5A30" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.25))"/>
    <text x="10" y="20.5" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="12" text-anchor="middle">X</text>
  </g>
</svg>
