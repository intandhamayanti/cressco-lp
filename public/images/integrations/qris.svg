<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <filter id="qrisShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="#ffffff" filter="url(#qrisShadow)"/>
  <g transform="translate(6, 12)">
    <!-- QRIS Red Accent Header Line -->
    <rect x="0" y="0" width="36" height="3" rx="1.5" fill="#EE2737"/>
    <!-- QRIS Bold Typographic Wordmark -->
    <text x="18" y="16" fill="#1C1B1F" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="12" letter-spacing="-0.5" text-anchor="middle">QRIS</text>
    <text x="18" y="22" fill="#71717A" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="3.8" letter-spacing="0.4" text-anchor="middle">NASIONAL</text>
  </g>
</svg>
